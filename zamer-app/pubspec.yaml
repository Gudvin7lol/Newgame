name: zamer_app
publish_to: 'none'
description: Обмер, планировка, отделка и инженерная подготовка помещений
version: 1.5.5+46

environment:
  sdk: '>=3.10.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.5.5
  image_picker: ^1.1.2
  pdf: ^3.11.3
  printing: ^5.14.2
  path_provider: ^2.1.5
  share_plus: ^10.1.4
  file_picker:
    path: third_party/file_picker
  archive: ^4.3.0
  flutter_scene: 0.23.0
  vector_math: ^2.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/models/zamer_catalog/
    - assets/models/zamer_premium/
    - assets/textures/
    - assets/textures/pbr/dark_oak/
    - assets/textures/pbr/paint/
    - assets/textures/pbr/ivory_tile/
    - assets/textures/pbr12/PAINT_01/performance/
    - assets/textures/pbr12/PAINT_01/quality/
    - assets/textures/pbr12/PLASTER_01/performance/
    - assets/textures/pbr12/PLASTER_01/quality/
    - assets/textures/pbr12/BRICK_01/performance/
    - assets/textures/pbr12/BRICK_01/quality/
    - assets/textures/pbr12/TILE_01/performance/
    - assets/textures/pbr12/TILE_01/quality/
    - assets/textures/pbr12/TILE_02/performance/
    - assets/textures/pbr12/TILE_02/quality/
    - assets/textures/pbr12/TILE_03/performance/
    - assets/textures/pbr12/TILE_03/quality/
    - assets/textures/pbr12/LAM_01/performance/
    - assets/textures/pbr12/LAM_01/quality/
    - assets/textures/pbr12/LAM_02/performance/
    - assets/textures/pbr12/LAM_02/quality/
    - assets/textures/pbr12/LAM_03/performance/
