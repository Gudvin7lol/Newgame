name: Verify finished opening reveals P9

on:
  push:
    branches: ['feature/zamer-electrical-finished-reveals-p9']
    paths:
      - 'zamer-app/lib/models/electrical_finished_reveal.dart'
      - 'zamer-app/lib/models/models.dart'
      - 'zamer-app/lib/services/electrical_opening_reveal_service.dart'
      - 'zamer-app/lib/services/electrical_wall_datum_service.dart'
      - 'zamer-app/lib/services/electrical_mounting_service.dart'
      - 'zamer-app/lib/widgets/electrical_finished_reveal_screen.dart'
      - 'zamer-app/lib/widgets/electrical_wall_face_screen.dart'
      - 'zamer-app/lib/screens/electrical_screen.dart'
      - 'zamer-app/test/electrical_finished_reveals_p9_test.dart'
      - '.github/workflows/verify-electrical-finished-reveals.yml'
  pull_request:
    paths:
      - 'zamer-app/lib/models/electrical_finished_reveal.dart'
      - 'zamer-app/lib/models/models.dart'
      - 'zamer-app/lib/services/electrical_opening_reveal_service.dart'
      - 'zamer-app/lib/services/electrical_wall_datum_service.dart'
      - 'zamer-app/lib/services/electrical_mounting_service.dart'
      - 'zamer-app/lib/widgets/electrical_finished_reveal_screen.dart'
      - 'zamer-app/lib/widgets/electrical_wall_face_screen.dart'
      - 'zamer-app/lib/screens/electrical_screen.dart'
      - 'zamer-app/test/electrical_finished_reveals_p9_test.dart'
      - '.github/workflows/verify-electrical-finished-reveals.yml'
permissions:
  contents: read

jobs:
  finished-reveals:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: 'true'
      FLUTTER_SUPPRESS_ANALYTICS: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - name: Dependencies
        working-directory: zamer-app
        run: flutter pub get
      - name: Analyze P9
        working-directory: zamer-app
        run: |
          flutter analyze --no-fatal-infos --no-fatal-warnings \
            lib/models/electrical_finished_reveal.dart \
            lib/models/models.dart \
            lib/services/electrical_opening_reveal_service.dart \
            lib/services/electrical_wall_datum_service.dart \
            lib/services/electrical_mounting_service.dart \
            lib/widgets/electrical_finished_reveal_screen.dart \
            lib/widgets/electrical_wall_face_screen.dart \
            lib/screens/electrical_screen.dart \
            test/electrical_finished_reveals_p9_test.dart
      - name: Finished reveals and P1-P9 regression
        working-directory: zamer-app
        run: |
          flutter test test/electrical_finished_reveals_p9_test.dart \
            test/electrical_wall_datums_p8_test.dart \
            test/electrical_wall_faces_p7_test.dart \
            test/electrical_wall_elevations_p6_test.dart \
            test/electrical_crossings_p5_test.dart \
            test/electrical_cable_journal_p4_test.dart \
            test/electrical_routes_p3_test.dart \
            test/electrical_network_test.dart \
            test/electrical_junction_editor_test.dart \
            test/electrical_mounting_test.dart \
            test/electrical_floor_camera_v154_test.dart
