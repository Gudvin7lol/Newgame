name: Build Zamer APK v0.9 Alpha 1 Source

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true

      - name: Check source archive
        run: |
          test -f zamer-v090-alpha1-src.tar.gz || {
            echo "Missing zamer-v090-alpha1-src.tar.gz in repository root"
            exit 1
          }

      - name: Create Android project shell
        run: flutter create . --platforms=android --org ru.zamer --project-name zamer_app --overwrite

      - name: Restore Zamer source
        run: tar -xzf zamer-v090-alpha1-src.tar.gz -C .

      - name: Set Android app name
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/src/main/AndroidManifest.xml')
          s = p.read_text()
          s = s.replace('android:label="zamer_app"', 'android:label="Замер"')
          p.write_text(s)
          PY

      - name: Get packages
        run: flutter pub get

      - name: Run tests
        run: flutter test

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build release APK
        run: flutter build apk --release

      - name: Prepare APK
        run: cp build/app/outputs/flutter-apk/app-release.apk zamer-v0.9.0-alpha1.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: zamer-android-apk-v0.9-alpha1
          path: zamer-v0.9.0-alpha1.apk
          if-no-files-found: error
