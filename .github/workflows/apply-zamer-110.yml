name: Apply Zamer 1.5.6+110

on:
  push:
    branches:
      - codex/zamer-1.5.6-3d-stability
    paths:
      - .github/workflows/apply-zamer-110.yml
      - zamer-app/tool/apply_110_surface_stability.py

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: codex/zamer-1.5.6-3d-stability
          fetch-depth: 0

      - name: Apply +110 stability patch
        run: python3 zamer-app/tool/apply_110_surface_stability.py

      - name: Commit source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add zamer-app/lib/renderer3d/zamer_gpu_viewport.dart \
                  zamer-app/lib/renderer3d/surface_stability_policy.dart \
                  zamer-app/test/surface_stability_policy_test.dart \
                  zamer-app/pubspec.yaml
          if git diff --cached --quiet; then
            echo "No source changes needed"
            exit 0
          fi
          git commit -m "Zamer 1.5.6+110: stabilize floor objects and wall finishes"
          git push origin HEAD:codex/zamer-1.5.6-3d-stability
