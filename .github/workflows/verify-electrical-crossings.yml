name: Verify electrical crossing review P5

on:
  push:
    branches: ['feature/zamer-electrical-crossings-p5']
    paths:
      - 'zamer-app/lib/services/electrical_crossing_service.dart'
      - 'zamer-app/lib/widgets/electrical_crossing_sheet.dart'
      - 'zamer-app/lib/widgets/electrical_plan_painter.dart'
      - 'zamer-app/lib/screens/electrical_screen.dart'
      - 'zamer-app/test/electrical_crossings_p5_test.dart'
      - '.github/workflows/verify-electrical-crossings.yml'
  pull_request:
    paths:
      - 'zamer-app/lib/services/electrical_crossing_service.dart'
      - 'zamer-app/lib/widgets/electrical_crossing_sheet.dart'
      - 'zamer-app/lib/widgets/electrical_plan_painter.dart'
      - 'zamer-app/lib/screens/electrical_screen.dart'
      - 'zamer-app/test/electrical_crossings_p5_test.dart'
      - '.github/workflows/verify-electrical-crossings.yml'

permissions:
  contents: read

jobs:
  crossings:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: 'true'
      FLUTTER_SUPPRESS_ANALYTICS: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - name: Dependencies
        working-directory: zamer-app
        run: flutter pub get
      - name: Analyze P5
        working-directory: zamer-app
        run: |
          flutter analyze --no-fatal-infos --no-fatal-warnings \
            lib/services/electrical_crossing_service.dart \
            lib/widgets/electrical_crossing_sheet.dart \
            lib/widgets/electrical_plan_painter.dart \
            lib/screens/electrical_screen.dart \
            test/electrical_crossings_p5_test.dart
      - name: Geometry and electric regression tests
        working-directory: zamer-app
        run: |
          flutter test test/electrical_crossings_p5_test.dart \
            test/electrical_cable_journal_p4_test.dart \
            test/electrical_routes_p3_test.dart \
            test/electrical_network_test.dart \
            test/electrical_junction_editor_test.dart \
            test/electrical_mounting_test.dart \
            test/electrical_floor_camera_v154_test.dart
