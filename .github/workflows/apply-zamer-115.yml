name: Apply Zamer 1.5.6+115

on:
  push:
    branches:
      - codex/zamer-1.5.6-3d-stability
    paths:
      - 'zamer-app/tool/apply_115_cutaway_corridor.py'
      - '.github/workflows/apply-zamer-115.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/zamer-1.5.6-3d-stability
          fetch-depth: 0
      - name: Apply +115 cutaway corridor
        run: python3 zamer-app/tool/apply_115_cutaway_corridor.py
      - name: Commit +115
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add zamer-app/lib/renderer3d/zamer_gpu_viewport.dart zamer-app/pubspec.yaml
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Zamer 1.5.6+115: focus cutaway on real occluders"
          git push origin HEAD:codex/zamer-1.5.6-3d-stability
