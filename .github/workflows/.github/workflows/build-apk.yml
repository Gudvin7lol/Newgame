
name: Build Zamer APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true

      - name: Create Flutter Android project
        run: flutter create . --platforms=android --org ru.zamer --project-name zamer_app --overwrite

      - name: Restore Zamer source
        shell: bash
        run: |
          set -e
          echo '' | base64 -d > 'pubspec.yaml'
          mkdir -p 'lib'
          echo '' | base64 -d > 'lib/main.dart'
          mkdir -p 'lib/models'
          echo '' | base64 -d > 'lib/models/models.dart'
          mkdir -p 'lib/screens'
          echo '' | base64 -d > 'lib/screens/projects_screen.dart'
          mkdir -p 'lib/screens'
          echo '' | base64 -d > 'lib/screens/rooms_screen.dart'
          mkdir -p 'lib/screens'
          echo '' | base64 -d > 'lib/screens/editor_screen.dart'
          mkdir -p 'lib/services'
          echo '' | base64 -d > 'lib/services/project_store.dart'
          mkdir -p 'lib/widgets'
          echo '' | base64 -d > 'lib/widgets/plan_painter.dart'

      - name: Set Android app name
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/src/main/AndroidManifest.xml')
          s = p.read_text()
          s = s.replace('android:label="zamer_app"', 'android:label="Замер"')
          p.write_text(s)
          PY

      - name: Get packages
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Prepare APK
        run: cp build/app/outputs/flutter-apk/app-release.apk zamer-v0.1.0.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: zamer-android-apk
          path: zamer-v0.1.0.apk
          if-no-files-found: error
