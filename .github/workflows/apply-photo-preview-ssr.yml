name: Apply Photo Preview SSR

on:
  push:
    paths:
      - '.github/workflows/apply-photo-preview-ssr.yml'

permissions:
  contents: write

concurrency:
  group: apply-photo-preview-ssr
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/zamer-1.5.6-3d-stability
          fetch-depth: 1
      - name: Enable lightweight Photo Preview reflections
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('zamer-app/lib/renderer3d/zamer_gpu_viewport.dart')
          text = path.read_text()
          old = '      screenSpaceReflectionsEnabled: exportQuality && hdr,'
          new = '      screenSpaceReflectionsEnabled: hdr,'
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one Photo SSR anchor, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY
          grep -F 'screenSpaceReflectionsEnabled: hdr,' zamer-app/lib/renderer3d/zamer_gpu_viewport.dart
      - name: Commit runtime fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add zamer-app/lib/renderer3d/zamer_gpu_viewport.dart
          git commit -m 'feat(zamer): add lightweight SSR to Photo preview'
          git push origin HEAD:codex/zamer-1.5.6-3d-stability
