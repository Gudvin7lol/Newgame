name: Apply GPU scene fingerprint

on:
  push:
    branches:
      - 'codex/zamer-1.5.6-3d-stability'
    paths:
      - 'zamer-app/lib/renderer3d/scene_fingerprint.dart'
      - 'zamer-app/test/scene_fingerprint_test.dart'
      - 'zamer-app/tool/migrations/use_scene_fingerprint.py'
      - '.github/workflows/apply-scene-fingerprint.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: zamer-scene-fingerprint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Sparse checkout
        uses: actions/checkout@v4
        with:
          ref: codex/zamer-1.5.6-3d-stability
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            zamer-app/lib/renderer3d/zamer_gpu_viewport.dart
            zamer-app/lib/renderer3d/scene_fingerprint.dart
            zamer-app/test/scene_fingerprint_test.dart
            zamer-app/tool/migrations/use_scene_fingerprint.py

      - name: Apply scene fingerprint integration
        run: python zamer-app/tool/migrations/use_scene_fingerprint.py

      - name: Setup Dart
        uses: dart-lang/setup-dart@v1

      - name: Format changed sources
        run: dart format zamer-app/lib/renderer3d/zamer_gpu_viewport.dart zamer-app/lib/renderer3d/scene_fingerprint.dart zamer-app/test/scene_fingerprint_test.dart

      - name: Verify integration
        shell: bash
        run: |
          set -euo pipefail
          VIEWPORT=zamer-app/lib/renderer3d/zamer_gpu_viewport.dart
          FINGERPRINT=zamer-app/lib/renderer3d/scene_fingerprint.dart
          grep -q "import 'scene_fingerprint.dart';" "$VIEWPORT"
          grep -q 'int _floorFingerprint() => ZamerSceneFingerprint.of(widget.floor);' "$VIEWPORT"
          grep -q 'opening.sillHeightMm' "$FINGERPRINT"
          grep -q 'opening.doorSwing' "$FINGERPRINT"
          grep -q 'meta.ceilingHeightMm' "$FINGERPRINT"
          grep -q 'object.layer' "$FINGERPRINT"
          grep -q 'point.modules.length' "$FINGERPRINT"

      - name: Commit renderer integration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add zamer-app/lib/renderer3d/zamer_gpu_viewport.dart zamer-app/lib/renderer3d/scene_fingerprint.dart zamer-app/test/scene_fingerprint_test.dart
          if git diff --cached --quiet; then
            echo 'Scene fingerprint already integrated.'
            exit 0
          fi
          git commit -m 'fix(zamer): rebuild GPU scene for all visual mutations'
          git push origin HEAD:codex/zamer-1.5.6-3d-stability
