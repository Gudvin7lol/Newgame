name: Verify Zamer works module

on:
  pull_request:
    paths:
      - 'zamer-app/lib/models/models.dart'
      - 'zamer-app/lib/models/work_board.dart'
      - 'zamer-app/lib/models/work_calendar.dart'
      - 'zamer-app/lib/screens/works_screen.dart'
      - 'zamer-app/lib/services/work_schedule_service.dart'
      - 'zamer-app/lib/services/work_co_stage_service.dart'
      - 'zamer-app/lib/services/work_generation_service.dart'
      - 'zamer-app/lib/services/work_surface_service.dart'
      - 'zamer-app/lib/services/work_floor_surface_service.dart'
      - 'zamer-app/lib/services/work_floor_polygon_service.dart'
      - 'zamer-app/lib/services/work_operation_taxonomy.dart'
      - 'zamer-app/lib/services/work_status_service.dart'
      - 'zamer-app/lib/services/workload_service.dart'
      - 'zamer-app/lib/screens/recovered_project_workspace_screen.dart'
      - 'zamer-app/test/work_board_test.dart'
      - 'zamer-app/test/work_co_stage_test.dart'
      - 'zamer-app/test/work_generation_test.dart'
      - 'zamer-app/test/work_surface_test.dart'
      - 'zamer-app/test/work_floor_surface_test.dart'
      - 'zamer-app/test/work_floor_polygon_test.dart'
      - 'zamer-app/test/work_floor_polygon_widget_test.dart'
      - 'zamer-app/test/work_surface_widget_test.dart'
      - 'zamer-app/test/work_calendar_test.dart'
      - 'zamer-app/test/workload_service_test.dart'
      - 'zamer-app/test/works_screen_test.dart'
      - '.github/workflows/verify-works.yml'
  workflow_dispatch:

jobs:
  flutter-works-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
      - name: Install dependencies
        working-directory: zamer-app
        run: flutter pub get
      - name: Analyze changed Dart files
        working-directory: zamer-app
        run: flutter analyze --no-fatal-infos lib/models/models.dart lib/models/work_board.dart lib/models/work_calendar.dart lib/services/work_schedule_service.dart lib/services/work_co_stage_service.dart lib/services/work_generation_service.dart lib/services/work_surface_service.dart lib/services/work_floor_surface_service.dart lib/services/work_floor_polygon_service.dart lib/services/work_operation_taxonomy.dart lib/services/work_status_service.dart lib/services/workload_service.dart lib/screens/works_screen.dart lib/screens/recovered_project_workspace_screen.dart
      - name: Test work-board persistence and progress
        working-directory: zamer-app
        run: flutter test test/work_board_test.dart test/work_co_stage_test.dart test/work_generation_test.dart test/work_surface_test.dart test/work_floor_surface_test.dart test/work_floor_polygon_test.dart test/work_floor_polygon_widget_test.dart test/work_surface_widget_test.dart test/work_calendar_test.dart test/workload_service_test.dart test/works_screen_test.dart
