name: Apply Zamer 103 Hotfix

on:
  push:
    paths:
      - '.github/workflows/apply-zamer-103-hotfix.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/zamer-1.5.6-3d-stability
          fetch-depth: 1

      - name: Fix PBR metallic property
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('zamer-app/lib/renderer3d/zamer_gpu_viewport.dart')
          text = p.read_text()
          old = ')..metallic = 0.86;'
          new = ')..metallicFactor = 0.86;'
          if old not in text:
              raise SystemExit('door metallic property anchor not found')
          p.write_text(text.replace(old, new, 1))
          PY
          grep -F 'metallicFactor = 0.86' zamer-app/lib/renderer3d/zamer_gpu_viewport.dart

      - name: Commit hotfix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add zamer-app/lib/renderer3d/zamer_gpu_viewport.dart
          git commit -m 'fix(zamer): use flutter_scene metallic factor for door hardware'
          git push origin HEAD:codex/zamer-1.5.6-3d-stability
