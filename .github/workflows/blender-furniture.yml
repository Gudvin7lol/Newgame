name: Blender furniture lab

on:
  push:
    branches:
      - feat/blender-furniture-lab
    paths:
      - "blender/**"
      - ".github/workflows/blender-furniture.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: blender-lab-${{ github.ref }}
  cancel-in-progress: true

jobs:
  make-3d-model:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install actual Blender
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y blender python3-numpy
          blender --version
          blender -b --python-exit-code 3 --python-expr 'import numpy; print("NumPy available", numpy.__version__)'

      - name: Generate stitched and pinned upholstery with Blender Cloth
        env:
          BLENDER_OUT: out/blender
        run: |
          mkdir -p out/blender
          blender -b -t 2 --python-exit-code 3 --python blender/cushion_v11.py

      - name: Inspect exported GLB and output files
        run: |
          python3 - <<'PY'
          import json
          import struct
          from pathlib import Path
          output = Path("out/blender")
          for name in ("cushion_v11.blend", "cushion_v11.glb", "cushion_v11_cycles.png", "linen05_basecolor.png", "linen05_normal.png", "cushion_v11_detail.png"):
              p = output / name
              assert p.is_file() and p.stat().st_size > 1000, f"Missing or empty: {p}"
              print(name, p.stat().st_size, "bytes")
              if name in ("linen05_normal.png", "linen05_orm.png"):
                  assert p.stat().st_size > 10000, "Likely black or empty PBR texture: " + name
          raw = (output / "cushion_v11.glb").read_bytes()
          assert raw[:4] == b"glTF"
          version, total = struct.unpack_from("<II", raw, 4)
          assert version == 2 and total == len(raw)
          n, kind = struct.unpack_from("<II", raw, 12)
          assert kind == 0x4E4F534A
          gltf = json.loads(raw[20:20+n])
          assert len(gltf.get("meshes", [])) >= 2, "Cloth shell or piping missing"
          assert len(gltf.get("images", [])) >= 3, "PBR texture channels missing"
          print("GLB_OK meshes=", len(gltf["meshes"]), "images=", len(gltf["images"]))
          PY

      - name: Upload downloadable Blender files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blender-cushion-v11
          path: out/blender/
          if-no-files-found: warn
          retention-days: 7
