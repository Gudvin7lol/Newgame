name: Build Zamer APK (architecture)

on:
  workflow_dispatch:
  push:
    branches:
      - codex/zamer-architecture-p0-155
    paths:
      - 'zamer-app/**'
      - '.github/workflows/codex-apk-build.yml'

permissions:
  contents: read

concurrency:
  group: zamer-apk-architecture-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true

      - name: Restore imported visual pack
        working-directory: zamer-app
        run: bash tool/imported_2026_10_02/restore_pack.sh

      - name: Get packages
        working-directory: zamer-app
        run: flutter pub get

      - name: Analyze
        working-directory: zamer-app
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Architecture tests
        working-directory: zamer-app
        run: flutter test test/workspace_architecture_test.dart

      - name: Build release APK
        working-directory: zamer-app
        run: flutter build apk --release

      - name: Prepare APK
        run: |
          set -euo pipefail
          cp zamer-app/build/app/outputs/flutter-apk/app-release.apk "$RUNNER_TEMP/Zamer-architecture-p0-155-release.apk"
          sha256sum "$RUNNER_TEMP/Zamer-architecture-p0-155-release.apk" > "$RUNNER_TEMP/Zamer-architecture-p0-155-release.apk.sha256"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Zamer-architecture-p0-155-APK
          path: |
            ${{ runner.temp }}/Zamer-architecture-p0-155-release.apk
            ${{ runner.temp }}/Zamer-architecture-p0-155-release.apk.sha256
          if-no-files-found: error
          retention-days: 14
