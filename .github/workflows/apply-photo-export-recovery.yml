name: Apply photo export recovery

on:
  push:
    branches:
      - 'codex/zamer-1.5.6-3d-stability'
    paths:
      - 'zamer-app/lib/renderer3d/photo_export_policy.dart'
      - 'zamer-app/test/photo_export_policy_test.dart'
      - 'zamer-app/test/photo_export_recovery_contract_test.dart'
      - 'zamer-app/tool/migrations/apply_photo_export_recovery.py'
      - '.github/workflows/apply-photo-export-recovery.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: zamer-photo-export-recovery-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Sparse checkout current branch
        uses: actions/checkout@v4
        with:
          ref: codex/zamer-1.5.6-3d-stability
          fetch-depth: 2
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            zamer-app/lib/renderer3d/zamer_gpu_viewport.dart
            zamer-app/lib/renderer3d/photo_export_policy.dart
            zamer-app/test/photo_export_policy_test.dart
            zamer-app/test/photo_export_recovery_contract_test.dart
            zamer-app/tool/migrations/apply_photo_export_recovery.py

      - name: Apply strict Photo export recovery
        run: python3 zamer-app/tool/migrations/apply_photo_export_recovery.py

      - name: Setup Dart
        uses: dart-lang/setup-dart@v1

      - name: Format changed sources
        run: dart format zamer-app/lib/renderer3d/zamer_gpu_viewport.dart zamer-app/lib/renderer3d/photo_export_policy.dart zamer-app/test/photo_export_policy_test.dart zamer-app/test/photo_export_recovery_contract_test.dart

      - name: Verify Photo export recovery integration
        shell: bash
        run: |
          set -euo pipefail
          VIEWPORT=zamer-app/lib/renderer3d/zamer_gpu_viewport.dart
          grep -q "import 'photo_export_policy.dart';" "$VIEWPORT"
          grep -q 'ZamerPhotoExportPolicy.requiresGpu(photoQuality: photoQuality)' "$VIEWPORT"
          grep -q 'var photoSceneAttempted = false;' "$VIEWPORT"
          grep -q '_scheduleLiveRebuildRetry();' "$VIEWPORT"

      - name: Commit Photo export recovery
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            zamer-app/lib/renderer3d/zamer_gpu_viewport.dart \
            zamer-app/lib/renderer3d/photo_export_policy.dart \
            zamer-app/test/photo_export_policy_test.dart \
            zamer-app/test/photo_export_recovery_contract_test.dart
          if git diff --cached --quiet; then
            echo 'Photo export recovery already integrated.'
            exit 0
          fi
          git commit -m 'fix(zamer): make Photo export strict and recoverable'
          git pull --rebase origin codex/zamer-1.5.6-3d-stability
          git push origin HEAD:codex/zamer-1.5.6-3d-stability
