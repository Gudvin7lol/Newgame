name: Verify electrical wall elevations P6
on:
  push:
    branches: ['feature/zamer-electrical-wall-elevations-p6']
    paths:
      - 'zamer-app/lib/services/electrical_wall_elevation_service.dart'
      - 'zamer-app/lib/widgets/electrical_wall_elevation_painter.dart'
      - 'zamer-app/lib/widgets/electrical_wall_elevation_screen.dart'
      - 'zamer-app/lib/screens/electrical_screen.dart'
      - 'zamer-app/test/electrical_wall_elevations_p6_test.dart'
      - '.github/workflows/verify-electrical-wall-elevations.yml'
  pull_request:
    paths:
      - 'zamer-app/lib/services/electrical_wall_elevation_service.dart'
      - 'zamer-app/lib/widgets/electrical_wall_elevation_painter.dart'
      - 'zamer-app/lib/widgets/electrical_wall_elevation_screen.dart'
      - 'zamer-app/lib/screens/electrical_screen.dart'
      - 'zamer-app/test/electrical_wall_elevations_p6_test.dart'
      - '.github/workflows/verify-electrical-wall-elevations.yml'

permissions:
  contents: read

jobs:
  elevations:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: 'true'
      FLUTTER_SUPPRESS_ANALYTICS: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - run: flutter pub get
        working-directory: zamer-app
      - name: Analyze P6
        run: |
          flutter analyze --no-fatal-infos --no-fatal-warnings \
            lib/services/electrical_wall_elevation_service.dart \
            lib/widgets/electrical_wall_elevation_painter.dart \
            lib/widgets/electrical_wall_elevation_screen.dart \
            lib/screens/electrical_screen.dart \
            test/electrical_wall_elevations_p6_test.dart
        working-directory: zamer-app
      - name: Wall elevations and earlier electrical regression tests
        run: |
          flutter test test/electrical_wall_elevations_p6_test.dart \
            test/electrical_crossings_p5_test.dart \
            test/electrical_cable_journal_p4_test.dart \
            test/electrical_routes_p3_test.dart \
            test/electrical_network_test.dart \
            test/electrical_junction_editor_test.dart \
            test/electrical_mounting_test.dart \
            test/electrical_floor_camera_v154_test.dart
        working-directory: zamer-app
