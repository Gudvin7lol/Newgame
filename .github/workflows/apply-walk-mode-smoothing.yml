name: Apply Walk Mode smoothing

on:
  push:
    branches:
      - 'codex/zamer-1.5.6-3d-stability'
    paths:
      - 'zamer-app/tool/migrations/apply_walk_mode_smoothing.py'
      - '.github/workflows/apply-walk-mode-smoothing.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: zamer-walk-smoothing-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Sparse checkout
        uses: actions/checkout@v4
        with:
          ref: codex/zamer-1.5.6-3d-stability
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            zamer-app/lib/screens/floor_3d_screen.dart
            zamer-app/tool/migrations/apply_walk_mode_smoothing.py

      - name: Apply smooth Walk Mode
        run: python zamer-app/tool/migrations/apply_walk_mode_smoothing.py

      - name: Setup Dart
        uses: dart-lang/setup-dart@v1

      - name: Format 3D screen
        working-directory: zamer-app
        run: dart format lib/screens/floor_3d_screen.dart

      - name: Verify Walk Mode integration
        working-directory: zamer-app
        shell: bash
        run: |
          set -euo pipefail
          grep -q '_walkSpeedMmPerSecond = 2500' lib/screens/floor_3d_screen.dart
          grep -q '_walkLookDelta.dx \* .55 + rawLook.dx \* .45' lib/screens/floor_3d_screen.dart
          grep -q 'Duration(milliseconds: 16)' lib/screens/floor_3d_screen.dart
          grep -q '_walkSpeedMmPerSecond \* deltaSeconds' lib/screens/floor_3d_screen.dart
          grep -q "м/с'" lib/screens/floor_3d_screen.dart
          if grep -q '_walkStepMm' lib/screens/floor_3d_screen.dart; then
            echo 'Legacy fixed-step Walk Mode is still present.'
            exit 1
          fi

      - name: Commit Walk Mode integration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add zamer-app/lib/screens/floor_3d_screen.dart
          if git diff --cached --quiet; then
            echo 'Walk Mode smoothing already applied.'
            exit 0
          fi
          git commit -m 'feat(zamer): make Walk Mode smooth at 60Hz'
          git push origin HEAD:codex/zamer-1.5.6-3d-stability
