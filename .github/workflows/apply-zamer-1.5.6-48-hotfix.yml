name: Apply Zamer 1.5.6+48 visual hotfix

on:
  push:
    branches:
      - 'codex/zamer-1.5.6-3d-stability'
    paths:
      - '.github/workflows/apply-zamer-1.5.6-48-hotfix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout working branch
        uses: actions/checkout@v4
        with:
          ref: codex/zamer-1.5.6-3d-stability
          fetch-depth: 0

      - name: Apply guarded source patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly 1 match, found {count}')
              return text.replace(old, new, 1)

          renderer_path = Path('zamer-app/lib/renderer3d/zamer_gpu_viewport.dart')
          text = renderer_path.read_text()

          text = replace_once(
              text,
              "      environmentIntensity: 0.90,\n      exposure: 1.0,",
              "      environmentIntensity: 0.82,\n      exposure: 0.94,",
              'interactive environment exposure',
          )
          text = replace_once(
              text,
              "    scene.environmentIntensity = 0.90;",
              "    scene.environmentIntensity = 0.82;",
              'interactive environment intensity',
          )
          text = replace_once(
              text,
              "      intensity: 2.45,",
              "      intensity: 1.95,",
              'interactive directional light',
          )

          text = replace_once(
              text,
              "      environmentIntensity: 1.15,\n      exposure: 1.06,",
              "      environmentIntensity: 0.92,\n      exposure: 0.94,",
              'photo environment exposure',
          )
          text = replace_once(text, "      brightness: 1.01,", "      brightness: 1.0,", 'photo brightness')
          text = replace_once(text, "      screenSpaceReflectionsIntensity: 0.55,", "      screenSpaceReflectionsIntensity: 0.38,", 'photo reflections')
          text = replace_once(text, "      bloomIntensity: 0.09,", "      bloomIntensity: 0.04,", 'photo bloom')
          text = replace_once(text, "      autoExposureStrength: 0.45,", "      autoExposureStrength: 0.28,", 'photo auto exposure strength')
          text = replace_once(text, "      autoExposureCompensation: 0.15,", "      autoExposureCompensation: -0.20,", 'photo auto exposure compensation')
          text = replace_once(text, "      autoExposureMaxEv: 1.8,", "      autoExposureMaxEv: 1.2,", 'photo auto exposure max')
          text = replace_once(text, "    scene.environmentIntensity = 1.15;", "    scene.environmentIntensity = 0.92;", 'photo scene environment')
          text = replace_once(text, "      intensity: 3.05,", "      intensity: 2.15,", 'photo directional light')

          text = replace_once(
              text,
              "    final key = '${surface.materialMode}:${surface.materialId}';",
              "    final key = '${surface.materialMode}:${surface.materialId}:${surface.laminatePattern}:${surface.laminateOffsetMode}:${surface.tilePattern}';",
              'floor material cache key',
          )
          text = replace_once(
              text,
              "    final tint = texture == null\n        ? _vectorColor(preset.color)\n        : vm.Vector4(0.98, 0.98, 0.98, 1);",
              "    final source = _vectorColor(preset.color);\n    final tint = texture == null\n        ? source\n        : vm.Vector4(\n            0.52 + source.x * 0.48,\n            0.52 + source.y * 0.48,\n            0.52 + source.z * 0.48,\n            1,\n          );",
              'floor texture tint',
          )
          text = replace_once(
              text,
              "    final key = '${nearest.materialMode}:${nearest.materialId}:under-wall';",
              "    final key = '${nearest.materialMode}:${nearest.materialId}:${nearest.laminatePattern}:${nearest.laminateOffsetMode}:${nearest.tilePattern}:under-wall';",
              'under-wall floor material cache key',
          )
          text = replace_once(
              text,
              "        -object.rotationRad,",
              "        -object.rotationRad + (asset?.yawCorrectionRad ?? 0),",
              'GLB semantic yaw correction',
          )

          old_light = """    final intensity = isWall
        ? 9.0
        : isFloor
        ? 7.0
        : isTrack
        ? 22.0
        : isPendant
        ? 28.0
        : isCeiling
        ? 20.0
        : 8.0;
    final range = isWall
        ? 5.0
        : isFloor
        ? 5.5
        : 9.5;"""
          new_light = """    final intensity = isWall
        ? 5.0
        : isFloor
        ? 4.5
        : isTrack
        ? 10.0
        : isPendant
        ? 12.0
        : isCeiling
        ? 9.0
        : 5.0;
    final range = isWall
        ? 3.8
        : isFloor
        ? 4.5
        : 6.0;"""
          text = replace_once(text, old_light, new_light, 'fixture light intensity')
          text = replace_once(
              text,
              "      ..emissiveStrength = isWall ? 2.8 : 4.8;",
              "      ..emissiveStrength = isWall ? 1.8 : 2.6;",
              'fixture emissive strength',
          )
          renderer_path.write_text(text)

          screen_path = Path('zamer-app/lib/screens/floor_3d_screen.dart')
          screen = screen_path.read_text()
          screen = replace_once(
              screen,
              "  Future<void> _showRenderSheet() async {\n    if (_rendering) return;\n    await showModalBottomSheet<void>(",
              "  Future<void> _showRenderSheet() async {\n    if (_rendering) return;\n    final size = MediaQuery.sizeOf(context);\n    final portrait = size.height >= size.width;\n    final hdWidth = portrait ? 1080 : 1920;\n    final hdHeight = portrait ? 1920 : 1080;\n    final twoKWidth = portrait ? 1440 : 2560;\n    final twoKHeight = portrait ? 2560 : 1440;\n    final fourKWidth = portrait ? 2160 : 3840;\n    final fourKHeight = portrait ? 3840 : 2160;\n    await showModalBottomSheet<void>(",
              'orientation aware render sizes',
          )
          screen = replace_once(screen, "subtitle: '1920 × 1080 • быстро',", "subtitle: '${hdWidth} × ${hdHeight} • быстро',", 'HD subtitle')
          screen = replace_once(screen, "_exportRender(width: 1920, height: 1080, label: 'HD');", "_exportRender(width: hdWidth, height: hdHeight, label: 'HD');", 'HD export')
          screen = replace_once(screen, "subtitle: '2560 × 1440 • презентация',", "subtitle: '${twoKWidth} × ${twoKHeight} • презентация',", '2K subtitle')
          screen = replace_once(screen, "_exportRender(width: 2560, height: 1440, label: '2K');", "_exportRender(width: twoKWidth, height: twoKHeight, label: '2K');", '2K export')
          screen = replace_once(screen, "subtitle: '3840 × 2160 • максимальное качество',", "subtitle: '${fourKWidth} × ${fourKHeight} • максимальное качество',", '4K subtitle')
          screen = replace_once(screen, "_exportRender(width: 3840, height: 2160, label: '4K');", "_exportRender(width: fourKWidth, height: fourKHeight, label: '4K');", '4K export')
          screen_path.write_text(screen)

          pubspec = Path('zamer-app/pubspec.yaml')
          p = pubspec.read_text()
          p = replace_once(p, 'version: 1.5.6+47', 'version: 1.5.6+48', 'version bump')
          pubspec.write_text(p)

          changelog = Path('zamer-app/CHANGELOG.md')
          c = changelog.read_text()
          entry = """## 1.5.6+48

- Исправлена семантическая ориентация направленной мебели в GPU 3D: кровати, диваны и кресла учитывают корректирующий yaw GLB, не меняя сохранённый угол объекта на плане.
- Напольные PBR-текстуры сохраняют цвет выбранного декора и лучше читаются при светлом освещении; ключ кэша материала учитывает схему/смещение раскладки и не смешивает разные варианты покрытия между помещениями.
- Снижены пересвет и локальные световые пятна: уменьшены энергия окружения, автоэкспозиция, мощность потолочных источников и emissive glow при сохранении теней/AO/SSR финального кадра.
- HD/2K/4K рендер теперь учитывает ориентацию экрана: в портретном режиме создаётся портретный кадр вплоть до 2160×3840 вместо принудительного широкого 3840×2160 с огромными полями в предпросмотре.

"""
          changelog.write_text(entry + c)
          PY

      - name: Format Dart sources
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
      - run: dart format zamer-app/lib/renderer3d/zamer_gpu_viewport.dart zamer-app/lib/screens/floor_3d_screen.dart zamer-app/lib/renderer3d/model_asset_catalog.dart zamer-app/test/model_asset_catalog_test.dart

      - name: Verify focused tests
        working-directory: zamer-app
        run: |
          flutter pub get
          flutter test test/model_asset_catalog_test.dart test/zamer_scene_geometry_test.dart test/material_catalog_assets_test.dart
          flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Commit hotfix
        shell: bash
        run: |
          git config user.name 'zamer-codex-bot'
          git config user.email 'zamer-codex-bot@users.noreply.github.com'
          git add zamer-app/lib/renderer3d/zamer_gpu_viewport.dart zamer-app/lib/screens/floor_3d_screen.dart zamer-app/pubspec.yaml zamer-app/CHANGELOG.md
          git diff --cached --check
          git commit -m 'Fix 3D floor visibility, object facing, and render exposure'
          git push origin HEAD:codex/zamer-1.5.6-3d-stability
