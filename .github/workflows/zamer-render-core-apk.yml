name: Zamer render-core APK

on:
  workflow_dispatch:
  push:
    branches:
      - feature/render-core-quality-foundation
    paths:
      - 'zamer-app/**'
      - '.github/workflows/zamer-render-core-apk.yml'

concurrency:
  group: zamer-render-core-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true

      - name: Get packages
        working-directory: zamer-app
        run: flutter pub get

      - name: Build standalone 3D Lab debug APK
        working-directory: zamer-app
        env:
          ZAMER_RENDER_LAB: "1"
        run: flutter build apk --debug

      - name: Prepare artifact
        run: |
          cp zamer-app/build/app/outputs/flutter-apk/app-debug.apk             "$RUNNER_TEMP/Zamer-3D-Lab-debug.apk"
          sha256sum "$RUNNER_TEMP/Zamer-3D-Lab-debug.apk"             > "$RUNNER_TEMP/Zamer-3D-Lab-debug.apk.sha256"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Zamer-3D-Lab-APK
          path: |
            ${{ runner.temp }}/Zamer-3D-Lab-debug.apk
            ${{ runner.temp }}/Zamer-3D-Lab-debug.apk.sha256
          retention-days: 14
