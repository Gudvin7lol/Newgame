name: Apply window glass rendering policy

on:
  push:
    paths:
      - '.github/workflows/apply-window-glass-blend.yml'

permissions:
  contents: write

concurrency:
  group: apply-window-glass-blend
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/zamer-1.5.6-3d-stability
          fetch-depth: 1
      - name: Keep transparent glass out of static shadows
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('zamer-app/lib/renderer3d/zamer_gpu_viewport.dart')
          text = path.read_text()
          old_sig = "      double depth = 0,\n      PhysicallyBasedMaterial? material,\n    }) {"
          new_sig = "      double depth = 0,\n      PhysicallyBasedMaterial? material,\n      bool castsShadows = true,\n    }) {"
          if old_sig not in text:
              raise SystemExit('opening bar signature anchor not found')
          text = text.replace(old_sig, new_sig, 1)
          old_flags = "            ..position = vm.Vector3(x, y, 0)\n            ..shadowStatic = true;"
          new_flags = "            ..position = vm.Vector3(x, y, 0)\n            ..castsShadows = castsShadows\n            ..shadowStatic = castsShadows;"
          if old_flags not in text:
              raise SystemExit('opening bar shadow anchor not found')
          text = text.replace(old_flags, new_flags, 1)
          old_glass = "          depth: 0.008,\n          material: glass,\n        ),"
          new_glass = "          depth: 0.008,\n          material: glass,\n          castsShadows: false,\n        ),"
          if old_glass not in text:
              raise SystemExit('window glass call anchor not found')
          text = text.replace(old_glass, new_glass, 1)
          path.write_text(text)
          PY
          grep -F 'castsShadows: false' zamer-app/lib/renderer3d/zamer_gpu_viewport.dart
          grep -F '..castsShadows = castsShadows' zamer-app/lib/renderer3d/zamer_gpu_viewport.dart
      - name: Commit runtime fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add zamer-app/lib/renderer3d/zamer_gpu_viewport.dart
          git commit -m 'fix(zamer): keep window glass out of static shadows'
          git push origin HEAD:codex/zamer-1.5.6-3d-stability
