name: Generate production sofa-3

on:
  workflow_dispatch:
  push:
    branches:
      - 'codex/zamer-1.5.6-3d-stability'
    paths:
      - 'zamer-app/tool/asset_pipeline/generate_sofa3.py'
      - '.github/workflows/generate-sofa3.yml'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: codex/zamer-1.5.6-3d-stability

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install model tooling
        run: python -m pip install --disable-pip-version-check numpy scipy networkx trimesh

      - name: Generate sofa and LODs
        run: python zamer-app/tool/asset_pipeline/generate_sofa3.py

      - name: Setup Dart
        uses: dart-lang/setup-dart@v1

      - name: Validate generated asset
        working-directory: zamer-app
        run: dart run tool/asset_pipeline/validate_asset.dart assets/models/zamer_catalog/sofa-3.asset.json

      - name: Commit generated model files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            zamer-app/assets/models/zamer_catalog/sofa-3.glb \
            zamer-app/assets/models/zamer_catalog/sofa-3_lod1.glb \
            zamer-app/assets/models/zamer_catalog/sofa-3_lod2.glb \
            zamer-app/assets/models/zamer_catalog/sofa-3.asset.json
          if git diff --cached --quiet; then
            echo 'Generated assets are already current.'
            exit 0
          fi
          git commit -m 'Generate production sofa-3 GLB asset and LODs'
          git push origin HEAD:codex/zamer-1.5.6-3d-stability
