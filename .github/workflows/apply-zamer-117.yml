name: Apply Zamer 1.5.6+117 line recovery

on:
  push:
    branches:
      - codex/zamer-1.5.6-3d-stability
    paths:
      - zamer-app/tool/apply_117_line_recovery.py

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/zamer-1.5.6-3d-stability
      - name: Apply +117 line recovery
        run: python3 zamer-app/tool/apply_117_line_recovery.py
      - name: Format changed Dart files
        run: |
          if command -v dart >/dev/null 2>&1; then
            dart format \
              zamer-app/lib/screens/home_concept_screen.dart \
              zamer-app/lib/screens/floor_workspace_screen.dart \
              zamer-app/lib/screens/measure_concept_workspace_screen.dart \
              zamer-app/lib/screens/plan_editor_master_v4_screen.dart \
              zamer-app/test/main_workspace_regression_test.dart
          fi
      - name: Commit +117
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add zamer-app/lib/screens/home_concept_screen.dart \
                  zamer-app/lib/screens/floor_workspace_screen.dart \
                  zamer-app/lib/screens/measure_concept_workspace_screen.dart \
                  zamer-app/lib/screens/plan_editor_master_v4_screen.dart \
                  zamer-app/test/main_workspace_regression_test.dart \
                  zamer-app/pubspec.yaml
          git diff --cached --quiet && exit 0
          git commit -m "Zamer 1.5.6+117: recover unified workspace line"
          git push
