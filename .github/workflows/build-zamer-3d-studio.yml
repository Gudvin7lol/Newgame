name: Build ZAMER 3D Studio Android

on:
  push:
    branches:
      - zamer-3d-studio
    paths:
      - "zamer-3d-studio/**"
      - ".github/workflows/build-zamer-3d-studio.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-apk:
    name: Native Godot Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Godot and export templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: "4.5.1"
          use-dotnet: false
          include-templates: true
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android SDK
        run: |
          echo "Android SDK: $ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Configure Godot and debug signing
        run: |
          mkdir -p "$HOME/.android" "$HOME/.config/godot"
          keytool -genkeypair -noprompt -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$HOME/.android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF
      - name: Import resources and check scripts
        run: godot --headless --editor --path zamer-3d-studio --import
      - name: Launch app scene and detect script errors
        run: |
          set -o pipefail
          godot --headless --path zamer-3d-studio --quit-after 20 2>&1 | tee /tmp/zamer-scene.log
          if grep -E "SCRIPT ERROR|Parse Error|Failed to load script|Invalid call|ERROR:" /tmp/zamer-scene.log; then
            echo "The scene has errors; refuse to publish this APK."
            exit 1
          fi
      - name: Test geometry
        run: godot --headless --path zamer-3d-studio --script res://tests/smoke.gd
      - name: Build APK
        run: |
          mkdir -p build
          godot --headless --verbose --path zamer-3d-studio --export-debug "Android" "$GITHUB_WORKSPACE/build/ZAMER-3D-Studio-0.4-debug.apk"
          test -s build/ZAMER-3D-Studio-0.4-debug.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ZAMER-3D-Studio-Android-APK
          path: build/ZAMER-3D-Studio-0.4-debug.apk
          if-no-files-found: error
