name: Apply Zamer 1.5.6+116

on:
  push:
    branches:
      - codex/zamer-1.5.6-3d-stability
    paths:
      - zamer-app/tool/apply_116_interaction_regressions.py

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/zamer-1.5.6-3d-stability
      - name: Apply +116 interaction regressions
        run: python3 zamer-app/tool/apply_116_interaction_regressions.py
      - name: Commit +116
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add zamer-app/lib/screens/projects_screen.dart \
                  zamer-app/lib/screens/plan_editor_master_v4_screen.dart \
                  zamer-app/pubspec.yaml
          git diff --cached --quiet && exit 0
          git commit -m "Zamer 1.5.6+116: restore direct editing and workspace entry"
          git push
