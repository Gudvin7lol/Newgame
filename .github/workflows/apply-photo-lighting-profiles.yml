name: Apply Photo Studio production features

on:
  push:
    branches:
      - 'codex/zamer-1.5.6-3d-stability'
    paths:
      - 'zamer-app/tool/migrations/apply_photo_lighting_profiles.py'
      - 'zamer-app/tool/migrations/apply_photo_lens_fov.py'
      - 'zamer-app/tool/migrations/fix_photo_fov_double.py'
      - 'zamer-app/tool/migrations/apply_photo_render_gallery.py'
      - 'zamer-app/tool/migrations/fix_photo_gallery_label.py'
      - '.github/workflows/apply-photo-lighting-profiles.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: zamer-photo-production-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: codex/zamer-1.5.6-3d-stability

      - name: Ensure Photo Studio lighting migration
        shell: bash
        run: |
          set -euo pipefail
          if ! grep -q 'enum ZamerPhotoTime' zamer-app/lib/renderer3d/zamer_gpu_viewport.dart; then
            python zamer-app/tool/migrations/apply_photo_lighting_profiles.py
          fi

      - name: Ensure real lens FOV migration
        shell: bash
        run: |
          set -euo pipefail
          if ! grep -q 'final double cameraFovDegrees' zamer-app/lib/renderer3d/zamer_gpu_viewport.dart; then
            python zamer-app/tool/migrations/apply_photo_lens_fov.py
          fi

      - name: Keep lens FOV strongly typed
        run: python zamer-app/tool/migrations/fix_photo_fov_double.py

      - name: Ensure persistent render gallery
        shell: bash
        run: |
          set -euo pipefail
          if ! grep -q '_showRenderGallery' zamer-app/lib/screens/photo_studio_screen.dart; then
            python zamer-app/tool/migrations/apply_photo_render_gallery.py
          fi
          python zamer-app/tool/migrations/fix_photo_gallery_label.py

      - name: Setup Dart
        uses: dart-lang/setup-dart@v1

      - name: Format Photo Studio production sources
        working-directory: zamer-app
        run: dart format lib/renderer3d/zamer_gpu_viewport.dart lib/screens/photo_studio_screen.dart test/photo_studio_camera_profile_test.dart

      - name: Verify Photo Studio production features
        working-directory: zamer-app
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'enum ZamerPhotoTime' lib/renderer3d/zamer_gpu_viewport.dart
          grep -q 'photoPreview: true' lib/screens/photo_studio_screen.dart
          grep -q 'photoTime: _time' lib/screens/photo_studio_screen.dart
          grep -q 'photoHdr: _hdr' lib/screens/photo_studio_screen.dart
          grep -q 'cameraFovDegrees: _lensFov(_lens)' lib/screens/photo_studio_screen.dart
          grep -q 'cameraFovDegrees.clamp(18.0, 90.0).toDouble()' lib/renderer3d/zamer_gpu_viewport.dart
          grep -q 'screenSpaceReflectionsEnabled: exportQuality && hdr' lib/renderer3d/zamer_gpu_viewport.dart
          grep -q 'photo_renders/\$_safeFloorId' lib/screens/photo_studio_screen.dart
          grep -q '_showRenderGallery' lib/screens/photo_studio_screen.dart
          grep -q "return '\${parts\[3\]}×\${parts\[4\]}'" lib/screens/photo_studio_screen.dart
          grep -q 'Share.shareXFiles' lib/screens/photo_studio_screen.dart
          if grep -q 'Галерея проекта будет подключена отдельным проходом' lib/screens/photo_studio_screen.dart; then
            echo 'Photo gallery placeholder is still present.'
            exit 1
          fi
          if grep -q '_zoom = (widget.zoom \* value)' lib/screens/photo_studio_screen.dart; then
            echo 'Lens presets still fake perspective by dolly zoom.'
            exit 1
          fi

      - name: Commit Photo Studio production integration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add zamer-app/lib/renderer3d/zamer_gpu_viewport.dart
          git add zamer-app/lib/screens/photo_studio_screen.dart
          git add zamer-app/test/photo_studio_camera_profile_test.dart
          if git diff --cached --quiet; then
            echo 'Photo Studio production features are already wired.'
            exit 0
          fi
          git commit -m 'feat(zamer): add persistent Photo Render gallery'
          git push origin HEAD:codex/zamer-1.5.6-3d-stability
