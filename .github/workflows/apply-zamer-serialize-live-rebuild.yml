name: Apply Zamer serialized live rebuild

on:
  push:
    branches:
      - codex/zamer-1.5.6-3d-stability
    paths:
      - .github/workflows/apply-zamer-serialize-live-rebuild.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/zamer-1.5.6-3d-stability
          fetch-depth: 0
      - name: Serialize live GPU scene rebuilds
        shell: python
        run: |
          from pathlib import Path
          path = Path('zamer-app/lib/renderer3d/zamer_gpu_viewport.dart')
          text = path.read_text()
          old_fields = '''  int _lastFloorFingerprint = 0;
'''
          new_fields = '''  int _lastFloorFingerprint = 0;
  bool _liveRebuildInProgress = false;
  bool _liveRebuildPending = false;
'''
          old_fn = '''  Future<void> _rebuildSceneAfterUpdate() async {
    try {
      await _rebuildScene();
      if (!mounted) return;
      if (!_ready && _loadError != null) {
        _scheduleRetry(immediate: true);
      }
    } catch (error) {
      if (!mounted) return;
      setState(() {
        _loadError = error;
        _ready = false;
      });
      // Editing the plan must never leave the GPU viewport permanently
      // blank. Recreate the GPU scene on the next frame instead of
      // requiring the user to restart the whole application.
      _scheduleRetry(immediate: true);
    }
  }
'''
          new_fn = '''  Future<void> _rebuildSceneAfterUpdate() async {
    if (_liveRebuildInProgress) {
      _liveRebuildPending = true;
      return;
    }
    _liveRebuildInProgress = true;
    try {
      do {
        _liveRebuildPending = false;
        try {
          await _rebuildScene();
          if (!mounted) return;
          if (!_ready && _loadError != null) {
            _scheduleRetry(immediate: true);
          }
        } catch (error) {
          if (!mounted) return;
          setState(() {
            _loadError = error;
            _ready = false;
          });
          // Editing the plan must never leave the GPU viewport permanently
          // blank. Recreate the GPU scene on the next frame instead of
          // requiring the user to restart the whole application.
          _scheduleRetry(immediate: true);
        }
      } while (mounted && _liveRebuildPending);
    } finally {
      _liveRebuildInProgress = false;
    }
  }
'''
          if old_fields not in text:
              raise SystemExit('state field anchor not found; refusing unsafe patch')
          if old_fn not in text:
              raise SystemExit('live rebuild function not found; refusing unsafe patch')
          text = text.replace(old_fields, new_fields, 1).replace(old_fn, new_fn, 1)
          path.write_text(text)
      - name: Format Dart
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
      - run: dart format zamer-app/lib/renderer3d/zamer_gpu_viewport.dart
      - name: Commit patch and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/apply-zamer-serialize-live-rebuild.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add zamer-app/lib/renderer3d/zamer_gpu_viewport.dart .github/workflows/apply-zamer-serialize-live-rebuild.yml
          git commit -m 'Serialize live GPU scene rebuilds'
          git push origin HEAD:codex/zamer-1.5.6-3d-stability
