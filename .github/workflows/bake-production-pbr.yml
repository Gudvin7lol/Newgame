name: Bake production PBR assets

on:
  push:
    branches:
      - 'codex/zamer-1.5.6-3d-stability'
    paths:
      - 'zamer-app/tool/asset_pipeline/bake_production_pbr.py'
      - 'zamer-app/tool/asset_pipeline/bake_surface_pbr.py'
      - '.github/workflows/bake-production-pbr.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bake:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: codex/zamer-1.5.6-3d-stability

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install texture tooling
        run: python -m pip install --disable-pip-version-check numpy scipy networkx trimesh pillow

      - name: Bake embedded GLB PBR texture maps
        run: python zamer-app/tool/asset_pipeline/bake_production_pbr.py

      - name: Bake architectural finish PBR maps
        run: python zamer-app/tool/asset_pipeline/bake_surface_pbr.py

      - name: Setup Dart
        uses: dart-lang/setup-dart@v1

      - name: Validate production assets after bake
        working-directory: zamer-app
        shell: bash
        run: |
          set -euo pipefail
          for meta in \
            armchair bed-160 bed-180 coffee-table dining-chair-upholstered \
            dining-table-1800 dresser-1200 nightstand office-desk-1400 \
            sofa-2 sofa-3 sofa-corner sofa-modular table-round tv-console-1600 \
            wardrobe-sliding-2000; do
            dart run tool/asset_pipeline/validate_asset.dart "assets/models/zamer_catalog/${meta}.asset.json"
          done

      - name: Commit baked production PBR assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add zamer-app/assets/models/zamer_catalog/*.glb
          git add zamer-app/assets/textures/generated_v1/*_normal.png
          git add zamer-app/assets/textures/generated_v1/*_height.png
          git add zamer-app/assets/textures/generated_v1/*_metallic_roughness.png
          git add zamer-app/assets/textures/generated_v1/pbr_manifest.json
          if git diff --cached --quiet; then
            echo 'Production PBR assets are already current.'
            exit 0
          fi
          git commit -m 'Bake production PBR models and finish maps'
          git push origin HEAD:codex/zamer-1.5.6-3d-stability
