name: Apply Zamer +109 patch

on:
  push:
    branches:
      - codex/zamer-1.5.6-3d-stability
    paths:
      - zamer-app/tool/apply_109_elevations.py
      - .github/workflows/apply-zamer-109.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/zamer-1.5.6-3d-stability
          fetch-depth: 0

      - name: Apply +109 source patch
        run: |
          python3 zamer-app/tool/apply_109_elevations.py
          git diff --check

      - name: Commit +109
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            zamer-app/lib/screens/elevations_screen.dart \
            zamer-app/pubspec.yaml
          git commit -m "Zamer 1.5.6+109: separate elevation navigation from tile editing"
          git push origin HEAD:codex/zamer-1.5.6-3d-stability
