name: Zamer Codex CI

on:
  push:
    branches:
      - 'codex/**'
    paths:
      - 'zamer-app/**'
      - 'tools/**'
      - '.github/workflows/zamer-codex-ci.yml'
  pull_request:
    paths:
      - 'zamer-app/**'
      - 'tools/**'
      - '.github/workflows/zamer-codex-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true

      - name: Get packages
        working-directory: zamer-app
        run: flutter pub get

      - name: Generate featured 3D models
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --quiet numpy pillow scipy
          python3 zamer-app/tool/featured_models/build_models.py sofa .55
          python3 zamer-app/tool/featured_models/build_models.py armchair .55
          python3 zamer-app/tool/featured_models/build_models.py table .55
          python3 zamer-app/tool/featured_models/build_models.py bed .55
          cp zamer-app/tool/featured_models/sofa/mobile/Zamer_Sofa_v3_Mobile.glb zamer-app/assets/models/zamer_catalog/sofa-3.glb
          cp zamer-app/tool/featured_models/armchair/mobile/Zamer_Armchair_Sand_Mobile.glb zamer-app/assets/models/zamer_catalog/armchair.glb
          cp zamer-app/tool/featured_models/table/mobile/Zamer_Table_Walnut_Mobile.glb zamer-app/assets/models/zamer_catalog/coffee-table.glb
          cp zamer-app/tool/featured_models/bed/mobile/Zamer_Bed_Sand_Mobile.glb zamer-app/assets/models/zamer_catalog/bed-180.glb
          ls -lh \
            zamer-app/assets/models/zamer_catalog/sofa-3.glb \
            zamer-app/assets/models/zamer_catalog/armchair.glb \
            zamer-app/assets/models/zamer_catalog/coffee-table.glb \
            zamer-app/assets/models/zamer_catalog/bed-180.glb

      - name: Format changed UI sources
        run: >-
          dart format
          zamer-app/lib/main.dart
          zamer-app/lib/design_system
          zamer-app/lib/screens/home_concept_screen.dart
          zamer-app/lib/screens/projects_screen.dart
          zamer-app/lib/screens/floor_workspace_screen.dart
          zamer-app/lib/screens/plan_editor_production_screen.dart
          zamer-app/lib/screens/plan_editor_master_v4_screen.dart
          zamer-app/lib/screens/floor_3d_screen.dart
          zamer-app/lib/widgets/projects_home_widgets.dart
          zamer-app/lib/widgets/workspace_master_header.dart
          zamer-app/lib/widgets/workspace_navigation.dart

      - name: Analyze
        working-directory: zamer-app
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Test headless-safe suite
        working-directory: zamer-app
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' tests < <(find test -name '*_test.dart' \
            ! -name 'workspace_history_test.dart' \
            ! -name 'v102_screen_smoke_test.dart' -print0)
          if [ "${#tests[@]}" -gt 0 ]; then
            flutter test "${tests[@]}"
          fi

      - name: GPU UI tests
        working-directory: zamer-app
        continue-on-error: true
        run: flutter test test/workspace_history_test.dart test/v102_screen_smoke_test.dart

      - name: Build release APK
        working-directory: zamer-app
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Zamer-Codex-APK
          path: zamer-app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7
