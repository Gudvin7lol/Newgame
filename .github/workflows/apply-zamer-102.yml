name: Apply Zamer 102

on:
  push:
    paths:
      - '.github/workflows/apply-zamer-102.yml'

permissions:
  contents: write

concurrency:
  group: apply-zamer-102
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/zamer-1.5.6-3d-stability
          fetch-depth: 1

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true

      - name: Apply +102 migration
        run: |
          set -euo pipefail
          python3 zamer-app/tool/migrations/apply_102.py
          python3 - <<'PY'
          from pathlib import Path
          p = Path('zamer-app/tool/featured_models/build_models.py')
          text = p.read_text()
          text = text.replace(",'emissiveStrength':2.4", '')
          p.write_text(text)
          PY
          dart format \
            zamer-app/lib/services/camera_gesture_policy.dart \
            zamer-app/lib/screens/floor_3d_screen.dart \
            zamer-app/lib/screens/photo_studio_screen.dart \
            zamer-app/lib/screens/planning_objects_screen.dart \
            zamer-app/lib/screens/elevations_screen.dart \
            zamer-app/lib/design_system/zamer_master_page_header.dart \
            zamer-app/lib/services/generated_material_ids.dart \
            zamer-app/lib/services/generated_pbr_finish_catalog.dart \
            zamer-app/lib/services/material_catalog.dart \
            zamer-app/lib/services/object_catalog.dart \
            zamer-app/lib/renderer3d/model_asset_catalog.dart

      - name: Verify migrated contracts
        run: |
          set -euo pipefail
          grep -F 'CameraGesturePolicy.applyHorizontalSwipe' zamer-app/lib/screens/floor_3d_screen.dart
          grep -F 'CameraGesturePolicy.applyHorizontalSwipe' zamer-app/lib/screens/photo_studio_screen.dart
          grep -F 'ZMasterPageHeader' zamer-app/lib/screens/planning_objects_screen.dart
          grep -F 'ZMasterPageHeader' zamer-app/lib/screens/elevations_screen.dart
          grep -F "'rug-2000x1400'" zamer-app/lib/services/object_catalog.dart
          grep -F 'oakNaturalPbr' zamer-app/lib/services/generated_material_ids.dart
          grep -F 'build_chain washer' .github/workflows/zamer-codex-ci.yml

      - name: Commit runtime package
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add zamer-app .github/workflows/zamer-codex-ci.yml
          git commit -m 'feat(zamer): intuitive camera master UI kit and content pack'
          git push origin HEAD:codex/zamer-1.5.6-3d-stability
