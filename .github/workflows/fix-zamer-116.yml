name: Fix Zamer 1.5.6+116 compile cleanup

on:
  push:
    branches:
      - codex/zamer-1.5.6-3d-stability
    paths:
      - zamer-app/tool/fix_116_compile.py

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/zamer-1.5.6-3d-stability
      - name: Apply +116 compile cleanup
        run: python3 zamer-app/tool/fix_116_compile.py
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add zamer-app/lib/screens/plan_editor_master_v4_screen.dart
          git diff --cached --quiet && exit 0
          git commit -m "Zamer +116: clean direct interaction integration"
          git push
