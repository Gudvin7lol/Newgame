name: Apply camera-relative cutaway

on:
  push:
    branches:
      - 'codex/zamer-1.5.6-3d-stability'
    paths:
      - 'zamer-app/tool/migrations/fix_cutaway_camera_target.py'
      - '.github/workflows/apply-cutaway-camera-target.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: zamer-cutaway-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Sparse checkout
        uses: actions/checkout@v4
        with:
          ref: codex/zamer-1.5.6-3d-stability
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            zamer-app/lib/renderer3d/zamer_gpu_viewport.dart
            zamer-app/tool/migrations/fix_cutaway_camera_target.py

      - name: Apply camera-relative cutaway
        run: python zamer-app/tool/migrations/fix_cutaway_camera_target.py

      - name: Setup Dart
        uses: dart-lang/setup-dart@v1

      - name: Format renderer
        run: dart format zamer-app/lib/renderer3d/zamer_gpu_viewport.dart

      - name: Verify cutaway integration
        shell: bash
        run: |
          set -euo pipefail
          FILE=zamer-app/lib/renderer3d/zamer_gpu_viewport.dart
          grep -q 'widget.tilt >= 1.32' "$FILE"
          grep -q 'final target2 = vm.Vector2(' "$FILE"
          grep -q 'final cameraFromTarget = camera2 - target2;' "$FILE"
          grep -q 'final relative = wallPos - target2;' "$FILE"
          grep -q 'final inViewCorridor = lateral < corridorHalfWidth + 0.25;' "$FILE"
          if grep -q 'final cameraDir = camera2.normalized();' "$FILE"; then
            echo 'Legacy world-origin cutaway is still present.'
            exit 1
          fi

      - name: Commit cutaway integration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add zamer-app/lib/renderer3d/zamer_gpu_viewport.dart
          if git diff --cached --quiet; then
            echo 'Camera-relative cutaway already applied.'
            exit 0
          fi
          git commit -m 'fix(zamer): make cutaway follow camera target'
          git push origin HEAD:codex/zamer-1.5.6-3d-stability
