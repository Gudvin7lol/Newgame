name: Verify electrical precision P16

on:
  push:
    branches: ['feature/zamer-electrical-stage1-p16-precision']
  pull_request:
    paths:
      - 'zamer-app/lib/screens/electrical_screen.dart'
      - 'zamer-app/lib/services/electrical_snap_service.dart'
      - 'zamer-app/lib/services/electrical_frame_geometry.dart'
      - 'zamer-app/lib/widgets/electrical_plan_painter.dart'
      - 'zamer-app/test/electrical_precision_p16_test.dart'
      - '.github/workflows/verify-electrical-precision-p16.yml'

permissions:
  contents: read

jobs:
  precision:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - name: Dependencies
        working-directory: zamer-app
        run: flutter pub get
      - name: Analyze affected sources
        working-directory: zamer-app
        run: |
          flutter analyze --no-fatal-infos --no-fatal-warnings \
            lib/screens/electrical_screen.dart \
            lib/services/electrical_snap_service.dart \
            lib/services/electrical_frame_geometry.dart \
            lib/widgets/electrical_plan_painter.dart \
            test/electrical_precision_p16_test.dart
      - name: Test snapping and existing electrical contracts
        working-directory: zamer-app
        run: |
          flutter test \
            test/electrical_precision_p16_test.dart \
            test/electrical_frame_fan_p15_test.dart \
            test/electrical_workspace_stage1_p12_test.dart \
            test/electrical_mounting_test.dart \
            test/electrical_wall_elevations_p6_test.dart \
            test/electrical_cable_journal_p4_test.dart
