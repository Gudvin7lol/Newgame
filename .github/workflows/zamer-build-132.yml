name: Zamer 1.5.7+132 geometry and layout

on:
  workflow_dispatch:
  push:
    branches:
      - codex/zamer-1.5.7-132-geometry-snaps
    paths:
      - 'zamer-app/**'
      - '.github/workflows/zamer-build-132.yml'

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true

      - name: Fetch approved CC0 model assets
        working-directory: zamer-app
        run: bash tool/fetch_cc0_furniture.sh .

      - name: Restore Dart dependencies
        working-directory: zamer-app
        run: flutter pub get

      - name: Analyze Dart code
        working-directory: zamer-app
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Test geometry and layout regressions
        working-directory: zamer-app
        run: |
          flutter test test/node_move_test.dart \
            test/geometry_snapping_v132_test.dart \
            test/layout_phase_v132_test.dart \
            test/carpet_layout_test.dart

      - name: Build Android release
        working-directory: zamer-app
        run: flutter build apk --release

      - name: Stage APK and checksum
        shell: bash
        run: |
          set -euo pipefail
          cp zamer-app/build/app/outputs/flutter-apk/app-release.apk "$RUNNER_TEMP/Zamer-1.5.7-build132-release.apk"
          cd "$RUNNER_TEMP"
          sha256sum Zamer-1.5.7-build132-release.apk > Zamer-1.5.7-build132-release.apk.sha256

      - name: Upload tested APK
        uses: actions/upload-artifact@v4
        with:
          name: Zamer-1.5.7-build132-APK
          path: |
            ${{ runner.temp }}/Zamer-1.5.7-build132-release.apk
            ${{ runner.temp }}/Zamer-1.5.7-build132-release.apk.sha256
          if-no-files-found: error
          retention-days: 14
