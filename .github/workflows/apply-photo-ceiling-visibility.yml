name: Apply Photo Ceiling Visibility

on:
  push:
    paths:
      - '.github/workflows/apply-photo-ceiling-visibility.yml'

permissions:
  contents: write

concurrency:
  group: apply-photo-ceiling-visibility
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/zamer-1.5.6-3d-stability
          fetch-depth: 1
      - name: Apply Photo ceiling policy
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('zamer-app/lib/renderer3d/zamer_gpu_viewport.dart')
          text = path.read_text()
          import_anchor = "import 'camera_clip_policy.dart';"
          import_line = "import 'ceiling_visibility_policy.dart';"
          if import_line not in text:
              if text.count(import_anchor) != 1:
                  raise SystemExit(f'expected one camera clip import anchor, found {text.count(import_anchor)}')
              text = text.replace(import_anchor, import_anchor + '\n' + import_line, 1)
          old = '      ceiling.visible = widget.walkMode;'
          new = '''      ceiling.visible = ZamerCeilingVisibilityPolicy.visible(
        walkMode: widget.walkMode,
        photoPreview: widget.photoPreview,
      );'''
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit('ceiling visibility anchor not found')
          path.write_text(text)
          PY
          grep -F "import 'ceiling_visibility_policy.dart';" zamer-app/lib/renderer3d/zamer_gpu_viewport.dart
          grep -F 'photoPreview: widget.photoPreview,' zamer-app/lib/renderer3d/zamer_gpu_viewport.dart
      - name: Commit runtime fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add zamer-app/lib/renderer3d/zamer_gpu_viewport.dart
          git commit -m 'fix(zamer): keep ceiling in Photo render'
          git push origin HEAD:codex/zamer-1.5.6-3d-stability
