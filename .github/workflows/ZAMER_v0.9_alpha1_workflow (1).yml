      - name: Set Android app name
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/src/main/AndroidManifest.xml')
          s = p.read_text()
          s = s.replace('android:label="zamer_app"', 'android:label="Замер"')
          p.write_text(s)
          PY

      - name: Get packages
        run: flutter pub get

      - name: Tests
        run: flutter test

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Build release APK
        run: flutter build apk --release

      - name: Prepare APK
        run: cp build/app/outputs/flutter-apk/app-release.apk zamer-v0.9.0-alpha1.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: zamer-android-apk-v0.9-alpha1
          path: zamer-v0.9.0-alpha1.apk
          if-no-files-found: error
          retention-days: 14
