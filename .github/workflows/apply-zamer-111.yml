name: Apply Zamer 1.5.6+111

on:
  push:
    branches:
      - codex/zamer-1.5.6-3d-stability
    paths:
      - .github/workflows/apply-zamer-111.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/zamer-1.5.6-3d-stability
          fetch-depth: 0
      - name: Apply +111 opening integration
        run: python3 zamer-app/tool/apply_111_openings.py
      - name: Commit +111
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add zamer-app/lib/renderer3d/zamer_gpu_viewport.dart zamer-app/pubspec.yaml
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Zamer 1.5.6+111: finish door and window geometry"
          git push origin HEAD:codex/zamer-1.5.6-3d-stability
