name: Fabric scan v13 (real CC0 PBR)
on:
  push:
    branches:
      - feat/blender-furniture-lab
    paths:
      - blender/scan_fabric_v13.py
      - .github/workflows/fabric-scan-v13.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scanned-material:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y python3-pil python3-numpy
      - name: Download actual scanned linen and build proper PBR maps
        env:
          BLENDER_OUT: out/blender
        run: |
          python3 blender/scan_fabric_v13.py
      - name: Upload scanned PBR textures
        uses: actions/upload-artifact@v4
        with:
          name: cc0-linen-scan-v13
          path: out/blender/scan_v13/
          retention-days: 7
