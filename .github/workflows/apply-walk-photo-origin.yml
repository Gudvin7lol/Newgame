name: Apply Walk Photo Origin

on:
  push:
    paths:
      - '.github/workflows/apply-walk-photo-origin.yml'

permissions:
  contents: write

concurrency:
  group: apply-walk-photo-origin
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/zamer-1.5.6-3d-stability
          fetch-depth: 1
      - name: Preserve Walk camera origin in Photo Studio
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new, label):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'{label}: anchor not found')
              p.write_text(text.replace(old, new, 1))

          gpu = 'zamer-app/lib/renderer3d/zamer_gpu_viewport.dart'
          replace_once(gpu, "    this.cameraFovDegrees = 46,\n  });", "    this.cameraFovDegrees = 46,\n    this.photoCameraOriginXMm,\n    this.photoCameraOriginYMm,\n  });", 'gpu constructor')
          replace_once(gpu, "  final double cameraFovDegrees;\n", "  final double cameraFovDegrees;\n  final double? photoCameraOriginXMm;\n  final double? photoCameraOriginYMm;\n", 'gpu fields')
          camera_anchor = "    if (widget.walkMode) {\n"
          camera_branch = "    final photoOriginXMm = widget.photoCameraOriginXMm;\n    final photoOriginYMm = widget.photoCameraOriginYMm;\n    if (widget.photoPreview &&\n        photoOriginXMm != null &&\n        photoOriginYMm != null) {\n      final eye = vm.Vector3(\n        _mx(photoOriginXMm, bounds),\n        1.65,\n        _mz(photoOriginYMm, bounds),\n      );\n      final pitch = widget.tilt.clamp(-0.7, 0.7).toDouble();\n      final cp = math.cos(pitch);\n      final forward = vm.Vector3(\n        math.cos(widget.rotation) * cp,\n        math.sin(pitch),\n        math.sin(widget.rotation) * cp,\n      );\n      final fovDegrees = widget.cameraFovDegrees.clamp(18.0, 90.0).toDouble();\n      return PerspectiveCamera(\n        fovRadiansY: fovDegrees * math.pi / 180,\n        position: eye,\n        target: eye + forward * 4,\n        up: vm.Vector3(0, 1, 0),\n        fovNear: ZamerCameraClipPolicy.near(walkMode: true),\n        fovFar: ZamerCameraClipPolicy.walkFarM,\n      );\n    }\n\n    if (widget.walkMode) {\n"
          replace_once(gpu, camera_anchor, camera_branch, 'photo first-person camera')

          floor = 'zamer-app/lib/screens/floor_3d_screen.dart'
          replace_once(floor, "          pan: _pan,\n        ),", "          pan: _pan,\n          cameraOriginXMm: _walkMode ? _walkX : null,\n          cameraOriginYMm: _walkMode ? _walkY : null,\n        ),", 'floor to photo origin')

          photo = 'zamer-app/lib/screens/photo_studio_screen.dart'
          replace_once(photo, "    required this.pan,\n  });", "    required this.pan,\n    this.cameraOriginXMm,\n    this.cameraOriginYMm,\n  });", 'photo constructor')
          replace_once(photo, "  final Offset pan;\n", "  final Offset pan;\n  final double? cameraOriginXMm;\n  final double? cameraOriginYMm;\n", 'photo fields')
          replace_once(photo, "  int _renderCount = 0;\n", "  int _renderCount = 0;\n\n  bool get _usesWalkOrigin =>\n      widget.cameraOriginXMm != null && widget.cameraOriginYMm != null;\n", 'photo origin getter')
          old_tilt = "        _tilt = (_tilt - lookDelta.dy * .005).clamp(.15, 1.48).toDouble();"
          new_tilt = "        final minTilt = _usesWalkOrigin ? -0.7 : 0.15;\n        final maxTilt = _usesWalkOrigin ? 0.7 : 1.48;\n        _tilt = (_tilt - lookDelta.dy * .005)\n            .clamp(minTilt, maxTilt)\n            .toDouble();"
          replace_once(photo, old_tilt, new_tilt, 'photo pitch clamp')
          replace_once(photo, "                          cameraFovDegrees: _lensFov(_lens),\n", "                          cameraFovDegrees: _lensFov(_lens),\n                          photoCameraOriginXMm: widget.cameraOriginXMm,\n                          photoCameraOriginYMm: widget.cameraOriginYMm,\n", 'photo viewport origin')
          PY
          grep -F 'photoCameraOriginXMm' zamer-app/lib/renderer3d/zamer_gpu_viewport.dart
          grep -F 'cameraOriginXMm: _walkMode ? _walkX : null' zamer-app/lib/screens/floor_3d_screen.dart
          grep -F 'photoCameraOriginXMm: widget.cameraOriginXMm' zamer-app/lib/screens/photo_studio_screen.dart
      - name: Commit runtime fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add zamer-app/lib/renderer3d/zamer_gpu_viewport.dart zamer-app/lib/screens/floor_3d_screen.dart zamer-app/lib/screens/photo_studio_screen.dart
          git commit -m 'fix(zamer): preserve Walk camera in Photo Studio'
          git push origin HEAD:codex/zamer-1.5.6-3d-stability
