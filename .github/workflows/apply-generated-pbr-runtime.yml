name: Apply generated PBR runtime

on:
  push:
    branches:
      - 'codex/zamer-1.5.6-3d-stability'
    paths:
      - 'zamer-app/tool/migrations/apply_generated_pbr_runtime.py'
      - '.github/workflows/apply-generated-pbr-runtime.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: codex/zamer-1.5.6-3d-stability

      - name: Apply runtime migration
        run: python zamer-app/tool/migrations/apply_generated_pbr_runtime.py

      - name: Setup Dart
        uses: dart-lang/setup-dart@v1

      - name: Format migrated Dart sources
        working-directory: zamer-app
        run: dart format lib/renderer3d/zamer_gpu_viewport.dart lib/services/generated_pbr_finish_catalog.dart

      - name: Verify runtime hooks exist
        working-directory: zamer-app
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'normalTexture = normal' lib/renderer3d/zamer_gpu_viewport.dart
          grep -q 'metallicRoughnessTexture = metallicRoughness' lib/renderer3d/zamer_gpu_viewport.dart
          grep -q 'realWorldTileMm' lib/renderer3d/zamer_gpu_viewport.dart

      - name: Commit runtime integration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add zamer-app/lib/renderer3d/zamer_gpu_viewport.dart
          git add zamer-app/lib/services/generated_pbr_finish_catalog.dart
          if git diff --cached --quiet; then
            echo 'Generated PBR runtime is already wired.'
            exit 0
          fi
          git commit -m 'feat(zamer): use generated PBR maps in live 3D'
          git push origin HEAD:codex/zamer-1.5.6-3d-stability
