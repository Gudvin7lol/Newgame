name: Build Zamer APK v0.6

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/build-zamer-v0.6.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true

      - name: Create Flutter Android project
        run: flutter create . --platforms=android --org ru.zamer --project-name zamer_app --overwrite

      - name: Restore Zamer v0.6 source
        shell: bash
        run: |
          set -e
          rm -rf lib test
          echo '' | base64 -d > 'pubspec.yaml'
          echo 'aW5jbHVkZTogcGFja2FnZTpmbHV0dGVyX2xpbnRzL2ZsdXR0ZXIueWFtbAo=' | base64 -d > 'analysis_options.yaml'
          mkdir -p 'lib'
          echo '' | base64 -d > 'lib/main.dart'
          mkdir -p 'lib/models'
          echo '' | base64 -d > 'lib/models/models.dart'
          mkdir -p 'lib/screens'
          echo '' | base64 -d > 'lib/screens/electrical_screen.dart'
          mkdir -p 'lib/screens'
          echo '' | base64 -d > 'lib/screens/elevations_screen.dart'
          mkdir -p 'lib/screens'
          echo '' | base64 -d > 'lib/screens/floor_3d_screen.dart'
          mkdir -p 'lib/screens'
          echo '' | base64 -d > 'lib/screens/floor_workspace_screen.dart'
          mkdir -p 'lib/screens'
          echo '' | base64 -d > 'lib/screens/floors_screen.dart'
          mkdir -p 'lib/screens'
          echo '' | base64 -d > 'lib/screens/layouts_screen.dart'
          mkdir -p 'lib/screens'
          echo '' | base64 -d > 'lib/screens/materials_screen.dart'
          mkdir -p 'lib/screens'
          echo '' | base64 -d > 'lib/screens/plan_editor_screen.dart'
          mkdir -p 'lib/screens'
          echo '' | base64 -d > 'lib/screens/projects_screen.dart'
          mkdir -p 'lib/screens'
          echo '' | base64 -d > 'lib/screens/rooms_screen.dart'
          mkdir -p 'lib/services'
          echo '' | base64 -d > 'lib/services/geometry_service.dart'
          mkdir -p 'lib/services'
          echo '' | base64 -d > 'lib/services/layout_service.dart'
          mkdir -p 'lib/services'
          echo '' | base64 -d > 'lib/services/material_service.dart'
          mkdir -p 'lib/services'
          echo '' | base64 -d > 'lib/services/project_store.dart'
          mkdir -p 'lib/services'
          echo '' | base64 -d > 'lib/services/report_service.dart'
          mkdir -p 'lib/widgets'
          echo '' | base64 -d > 'lib/widgets/electrical_plan_painter.dart'
          mkdir -p 'lib/widgets'
          echo '' | base64 -d > 'lib/widgets/elevation_painter.dart'
          mkdir -p 'lib/widgets'
          echo '' | base64 -d > 'lib/widgets/floor_3d_painter.dart'
          mkdir -p 'lib/widgets'
          echo '' | base64 -d > 'lib/widgets/floor_layout_painter.dart'
          mkdir -p 'lib/widgets'
          echo '' | base64 -d > 'lib/widgets/floor_plan_painter.dart'
          mkdir -p 'test'
          echo '' | base64 -d > 'test/feature_v05_test.dart'
          mkdir -p 'test'
          echo '' | base64 -d > 'test/feature_v06_test.dart'
          mkdir -p 'test'
          echo '' | base64 -d > 'test/geometry_test.dart'
          mkdir -p 'test'
          echo '' | base64 -d > 'test/node_move_test.dart'

      - name: Set Android app name
        shell: bash
        run: |
          python3 - <<'PY2'
          from pathlib import Path
          p = Path('android/app/src/main/AndroidManifest.xml')
          s = p.read_text()
          s = s.replace('android:label="zamer_app"', 'android:label="Замер"')
          p.write_text(s)
          PY2

      - name: Get packages
        run: flutter pub get

      - name: Feature tests
        run: flutter test

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build release APK
        run: flutter build apk --release

      - name: Prepare APK
        run: cp build/app/outputs/flutter-apk/app-release.apk zamer-v0.6.0.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: zamer-android-apk-v0.6
          path: zamer-v0.6.0.apk
          if-no-files-found: error
