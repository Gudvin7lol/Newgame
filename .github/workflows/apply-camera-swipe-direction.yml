name: Apply Camera Swipe Direction

on:
  push:
    paths:
      - '.github/workflows/apply-camera-swipe-direction.yml'

permissions:
  contents: write

concurrency:
  group: apply-camera-swipe-direction
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/zamer-1.5.6-3d-stability
          fetch-depth: 1
      - name: Flip horizontal look direction
        run: |
          python3 -c "from pathlib import Path; p=Path('zamer-app/lib/screens/floor_3d_screen.dart'); s=p.read_text(); old='final angle = _rotation + lookDelta.dx * lookSensitivity;'; new='final angle = _rotation - lookDelta.dx * lookSensitivity;'; assert old in s, 'floor 3D anchor missing'; p.write_text(s.replace(old,new,1))"
          python3 -c "from pathlib import Path; p=Path('zamer-app/lib/screens/photo_studio_screen.dart'); s=p.read_text(); old='final angle = _rotation + lookDelta.dx * .008;'; new='final angle = _rotation - lookDelta.dx * .008;'; assert old in s, 'Photo anchor missing'; p.write_text(s.replace(old,new,1))"
          grep -F 'final angle = _rotation - lookDelta.dx * lookSensitivity;' zamer-app/lib/screens/floor_3d_screen.dart
          grep -F 'final angle = _rotation - lookDelta.dx * .008;' zamer-app/lib/screens/photo_studio_screen.dart
      - name: Commit runtime fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add zamer-app/lib/screens/floor_3d_screen.dart zamer-app/lib/screens/photo_studio_screen.dart
          git commit -m 'fix(zamer): make camera follow swipe direction'
          git push origin HEAD:codex/zamer-1.5.6-3d-stability
