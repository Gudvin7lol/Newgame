name: Apply host wall cutaway linkage

on:
  push:
    branches:
      - 'codex/zamer-1.5.6-3d-stability'
    paths:
      - 'zamer-app/lib/renderer3d/host_wall_visibility.dart'
      - 'zamer-app/test/host_wall_visibility_test.dart'
      - 'zamer-app/tool/migrations/fix_host_wall_cutaway.py'
      - '.github/workflows/apply-host-wall-cutaway.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: zamer-host-wall-cutaway-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Sparse checkout current branch
        uses: actions/checkout@v4
        with:
          ref: codex/zamer-1.5.6-3d-stability
          fetch-depth: 2
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            zamer-app/lib/renderer3d/zamer_gpu_viewport.dart
            zamer-app/lib/renderer3d/zamer_scene_geometry.dart
            zamer-app/lib/renderer3d/host_wall_visibility.dart
            zamer-app/test/zamer_scene_geometry_test.dart
            zamer-app/test/host_wall_visibility_test.dart
            zamer-app/tool/migrations/fix_host_wall_cutaway.py

      - name: Apply host wall cutaway fix
        run: python3 zamer-app/tool/migrations/fix_host_wall_cutaway.py

      - name: Setup Dart
        uses: dart-lang/setup-dart@v1

      - name: Format changed sources
        run: dart format zamer-app/lib/renderer3d/zamer_gpu_viewport.dart zamer-app/lib/renderer3d/zamer_scene_geometry.dart zamer-app/lib/renderer3d/host_wall_visibility.dart zamer-app/test/zamer_scene_geometry_test.dart zamer-app/test/host_wall_visibility_test.dart

      - name: Verify host wall linkage
        shell: bash
        run: |
          set -euo pipefail
          VIEWPORT=zamer-app/lib/renderer3d/zamer_gpu_viewport.dart
          GEOMETRY=zamer-app/lib/renderer3d/zamer_scene_geometry.dart
          grep -q "import 'host_wall_visibility.dart';" "$VIEWPORT"
          grep -q '_hostedWallVisuals' "$VIEWPORT"
          grep -q 'zamerHostedWallVisualVisible' "$VIEWPORT"
          grep -q 'wallId: point.wallId' "$GEOMETRY"
          grep -q 'final String? wallId;' "$GEOMETRY"

      - name: Commit host wall integration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            zamer-app/lib/renderer3d/zamer_gpu_viewport.dart \
            zamer-app/lib/renderer3d/zamer_scene_geometry.dart \
            zamer-app/lib/renderer3d/host_wall_visibility.dart \
            zamer-app/test/zamer_scene_geometry_test.dart \
            zamer-app/test/host_wall_visibility_test.dart
          if git diff --cached --quiet; then
            echo 'Host wall cutaway linkage already integrated.'
            exit 0
          fi
          git commit -m 'fix(zamer): hide hosted visuals with cutaway walls'
          git pull --rebase origin codex/zamer-1.5.6-3d-stability
          git push origin HEAD:codex/zamer-1.5.6-3d-stability
