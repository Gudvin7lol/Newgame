name: Build ZAMER Native 3D Engine

on:
  push:
    branches: [zamer-native-engine]
    paths:
      - "zamer-native/**"
      - ".github/workflows/build-zamer-native-engine.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install native Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1"
      - name: Install offline GLSL validator
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq glslang-tools
      - name: Validate GLSL ES shaders
        run: python3 zamer-native/tests/validate_shader.py
      - name: Validate C++ mesh kernel
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror zamer-native/tests/mesh_core_test.cpp zamer-native/app/src/main/cpp/mesh_core.cpp -I zamer-native/app/src/main/cpp -o /tmp/zamer-mesh-tests
          /tmp/zamer-mesh-tests
      - name: Build Kotlin + C++ APK
        working-directory: zamer-native
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Verify APK
        run: test -s zamer-native/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ZAMER-Native-Engine-APK
          path: zamer-native/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
