name: Build Zamer APK v0.9 Alpha 1

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/zamer-v090-alpha1-20260926.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true

      - name: Create Android shell
        run: flutter create . --platforms=android --org ru.zamer --project-name zamer_app --overwrite

      - name: Restore Zamer v0.9 Alpha source
